name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: it, POSTGRES_DB: apex }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet -tags integration ./...
      - run: go test ./...
      - name: Start Temporal
        run: |
          docker run -d -p 7233:7233 temporalio/temporal:1.9.1 server start-dev --ip 0.0.0.0 --headless --log-level error
          timeout 60 bash -c 'until nc -z localhost 7233; do sleep 1; done'
          sleep 5
      - run: go test -p 1 -tags integration -count=1 ./internal/httpapi
        env:
          APEX_TEST_DATABASE_URL: postgres://postgres:it@localhost:5432/apex
          TEMPORAL_TEST_HOSTPORT: localhost:7233
