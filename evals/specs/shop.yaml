openapi: 3.0.3
info: { title: Shop, version: "1" }
servers: [{ url: http://localhost:8799/shop }]
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      description: Lists orders, 2 per page unless per_page says otherwise. Each order has id, customer_id, total (a number of dollars), status (late, shipped, delivered or cancelled) and days_late.
      parameters:
        - { name: status, in: query, description: "Only orders with this status: late, shipped, delivered or cancelled", schema: { type: string } }
        - { name: customer_id, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Orders
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Order" } } } }
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get one order
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The order, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
  /orders/{id}/refund:
    post:
      operationId: refundOrder
      summary: Refund an order in full
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses: { "200": { description: Refunded } }
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an order
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Cancelled } }
  /orders/{id}/notes:
    post:
      operationId: addOrderNote
      summary: Add an internal note to an order
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } } }
      responses: { "200": { description: Added } }
  /customers:
    get:
      operationId: listCustomers
      summary: List customers
      description: Lists customers, 2 per page unless per_page says otherwise. Each has id, name, email and tier (gold or standard).
      parameters:
        - { name: tier, in: query, description: "gold or standard", schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Customers
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Customer" } } } }
  /customers/{id}:
    get:
      operationId: getCustomer
      summary: Get one customer
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The customer, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
  /coupons:
    post:
      operationId: createCoupon
      summary: Give a customer a discount coupon
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [customer_id, percent], properties: { customer_id: { type: string }, percent: { type: number } } }
      responses: { "200": { description: Created } }
  /emails:
    post:
      operationId: sendEmail
      summary: Send an email
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [to, subject, body], properties: { to: { type: string }, subject: { type: string }, body: { type: string } } }
      responses: { "200": { description: Sent } }
components:
  schemas:
    Order:
      type: object
      properties: { id: { type: string }, customer_id: { type: string }, total: { type: number }, status: { type: string }, days_late: { type: integer } }
    Customer:
      type: object
      properties: { id: { type: string }, name: { type: string }, email: { type: string }, tier: { type: string } }
